<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10142b">
  <title>Cosmic Quiz — Space Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #10142b;
      --surface: rgba(25, 31, 61, .88);
      --surface-raised: #202749;
      --ink: #f7f7ff;
      --muted: #a9b0d0;
      --line: rgba(191, 201, 255, .16);
      --accent: #a99aff;
      --accent-strong: #846dff;
      --good: #53e0ad;
      --bad: #ff6f8b;
      --shadow: 0 28px 80px rgba(0, 0, 0, .32);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #f3f2ff;
        --surface: rgba(255, 255, 255, .91);
        --surface-raised: #f2f0ff;
        --ink: #202344;
        --muted: #707796;
        --line: rgba(69, 66, 126, .14);
        --accent: #7257e8;
        --accent-strong: #6045dc;
        --good: #148e68;
        --bad: #d94b67;
        --shadow: 0 24px 70px rgba(62, 53, 125, .14);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 13% 12%, rgba(135, 105, 255, .2), transparent 32%),
        radial-gradient(ellipse at 91% 86%, rgba(64, 201, 211, .13), transparent 30%),
        var(--page);
      font-size: 15px;
      line-height: 1.5;
      transition: background-color .25s, color .25s;
    }

    .app { width: min(100%, 520px); }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      font-size: 17px;
      letter-spacing: 0;
    }

    .quiz-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .card-inner { padding: clamp(23px, 6vw, 36px); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .score {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--surface-raised);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .score strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }
    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8d76ff, #59d8cf);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }
    #quiz-content > h1 {
      position: relative;
      margin: 27px 0 8px;
      padding: 19px 20px 20px 23px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 4px 15px 15px 4px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 74%),
        repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--line) 22%, transparent) 8px);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 5%, transparent);
      font-size: clamp(22px, 4.8vw, 28px);
      line-height: 1.28;
      letter-spacing: -.025em;
      text-wrap: balance;
    }
    #quiz-content > h1::before {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 10px 4px 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 65%, transparent);
      content: "";
      vertical-align: middle;
    }
    .result h1 {
      margin: 27px 0 8px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.035em;
    }
    .subtitle { margin: 0 0 21px; color: var(--muted); font-size: 14px; }
    .answers { display: grid; gap: 10px; }
    .answer {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .18s, box-shadow .18s;
    }
    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface-raised);
    }
    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .answer:disabled { cursor: default; }
    .answer-letter {
      display: grid;
      flex: 0 0 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-raised);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .answer.correct {
      border-color: var(--good);
      background: color-mix(in srgb, var(--good) 13%, transparent);
      animation: pop .35s ease-out;
    }
    .answer.correct .answer-letter { background: var(--good); color: #10251f; }
    .answer.wrong {
      border-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 12%, transparent);
      animation: shake .38s ease-in-out;
    }
    .answer.wrong .answer-letter { background: var(--bad); color: #32121a; }
    .answer.reveal { border-color: var(--good); }

    .feedback {
      min-height: 26px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .feedback.good { color: var(--good); font-weight: 700; }
    .feedback.bad { color: var(--bad); font-weight: 700; }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 13px;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .next-button, .restart-button {
      min-height: 44px;
      padding: 10px 17px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-strong), #9c71ed);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s, filter .16s;
    }
    .next-button:hover, .restart-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .next-button:disabled { opacity: .42; cursor: not-allowed; transform: none; }
    .result { padding: 13px 0 3px; text-align: center; }
    .result-emoji {
      display: grid;
      width: 94px;
      height: 94px;
      margin: 0 auto 18px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--surface-raised);
      font-size: 51px;
      animation: pop .5s cubic-bezier(.2,.8,.2,1);
    }
    .result h1 { margin-top: 0; }
    .result-copy { max-width: 360px; margin: 0 auto 20px; color: var(--muted); }
    .final-score { margin: 0 0 22px; color: var(--muted); font-weight: 700; }
    .final-score strong { color: var(--ink); font-size: 23px; }
    .result .restart-button { min-width: 170px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes shake {
      15%, 55% { transform: translateX(-5px); }
      35%, 75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop {
      0% { transform: scale(.94); }
      65% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Cosmic Quiz</div>
    <section class="quiz-card" aria-labelledby="question-title">
      <div class="card-inner" id="quiz-content">
        <div class="topline">
          <p class="eyebrow">Space explorer</p>
          <div class="score" aria-label="Current score">⭐ <span>Score</span> <strong id="score">0</strong></div>
        </div>
        <div class="progress-meta">
          <span id="question-count">Question 1 of 10</span>
          <span id="progress-percent">10%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <h1 id="question-title"></h1>
        <p class="subtitle">Choose the best answer to continue your mission.</p>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="card-footer">
          <span class="hint">One small step at a time 🚀</span>
          <button class="next-button" id="next" type="button" disabled>Check answer</button>
        </div>
      </div>
    </section>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1, fact: "Mars gets its rusty color from iron-rich dust." },
      { question: "What is the name of our galaxy?", options: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], answer: 2, fact: "Our solar system sits in one of the Milky Way's spiral arms." },
      { question: "Which planet has the most prominent ring system?", options: ["Saturn", "Neptune", "Earth", "Uranus"], answer: 0, fact: "Saturn's rings are made mostly of chunks of ice and rock." },
      { question: "What is the closest star to Earth?", options: ["Sirius", "Proxima Centauri", "The Sun", "Vega"], answer: 2, fact: "The Sun is about 150 million kilometers from Earth." },
      { question: "Which was the first human-made object to reach space?", options: ["Vostok 1", "Sputnik 1", "Apollo 11", "Voyager 1"], answer: 1, fact: "Sputnik 1 launched in 1957 and orbited Earth for three months." },
      { question: "What do astronauts wear to protect themselves in space?", options: ["A flight suit", "A pressure suit", "A diving suit", "A thermal blanket"], answer: 1, fact: "A spacesuit supplies oxygen and helps maintain safe pressure." },
      { question: "Which planet is the largest in our solar system?", options: ["Saturn", "Earth", "Neptune", "Jupiter"], answer: 3, fact: "Jupiter is so big that more than 1,300 Earths could fit inside it." },
      { question: "What is the name of the first person to walk on the Moon?", options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"], answer: 2, fact: "Neil Armstrong stepped onto the lunar surface in July 1969." },
      { question: "Which celestial body has a famous Great Red Spot?", options: ["Jupiter", "Mars", "The Sun", "Saturn"], answer: 0, fact: "Jupiter's Great Red Spot is a giant storm that has raged for centuries." },
      { question: "What force keeps planets in orbit around the Sun?", options: ["Magnetism", "Friction", "Gravity", "Solar wind"], answer: 2, fact: "The Sun's gravity keeps the planets moving in their orbits." }
    ];

    let current = 0;
    let score = 0;
    let answered = false;
    let title;
    let answers;
    let feedback;
    let nextButton;

    function cacheElements() {
      title = document.getElementById("question-title");
      answers = document.getElementById("answers");
      feedback = document.getElementById("feedback");
      nextButton = document.getElementById("next");
    }

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      title.textContent = item.question;
      document.getElementById("question-count").textContent = `Question ${current + 1} of ${questions.length}`;
      document.getElementById("progress-percent").textContent = `${Math.round((current + 1) / questions.length * 100)}%`;
      document.getElementById("progress-fill").style.width = `${(current + 1) / questions.length * 100}%`;
      const progress = document.getElementById("progress");
      progress.setAttribute("aria-valuenow", String(current + 1));
      progress.setAttribute("aria-valuetext", `Question ${current + 1} of ${questions.length}`);
      answers.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = "Check answer";
      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        button.addEventListener("click", () => chooseAnswer(index));
        answers.append(button);
      });
    }

    function chooseAnswer(choice) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answers.children];
      buttons.forEach(button => { button.disabled = true; });
      if (choice === item.answer) {
        score++;
        document.getElementById("score").textContent = String(score);
        buttons[choice].classList.add("correct");
        feedback.textContent = `Brilliant! ${item.fact}`;
        feedback.classList.add("good");
      } else {
        buttons[choice].classList.add("wrong");
        buttons[item.answer].classList.add("reveal");
        feedback.textContent = `Not quite — ${item.options[item.answer]} is right. ${item.fact}`;
        feedback.classList.add("bad");
      }
      nextButton.disabled = false;
      nextButton.textContent = current === questions.length - 1 ? "See my results" : "Next question";
      document.getElementById("announcement").textContent = feedback.textContent;
    }

    function showResults() {
      const percentage = score / questions.length;
      const result = percentage === 1
        ? { emoji: "🏆", title: "Out of this world!", copy: "A perfect mission. You really know your way around the cosmos." }
        : percentage >= .7
          ? { emoji: "🚀", title: "Stellar work!", copy: "You explored the cosmos like a pro. Keep reaching for the stars!" }
          : percentage >= .4
            ? { emoji: "🌙", title: "Nice exploring!", copy: "You’re finding your orbit. There’s always more of the universe to discover." }
            : { emoji: "🪐", title: "Space cadet in training!", copy: "Every great explorer starts somewhere. Ready to launch again?" };
      document.getElementById("quiz-content").innerHTML = `
        <div class="result">
          <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
          <p class="eyebrow">Mission complete</p>
          <h1 id="question-title">${result.title}</h1>
          <p class="result-copy">${result.copy}</p>
          <p class="final-score">You scored <strong>${score} / ${questions.length}</strong></p>
          <button class="restart-button" id="restart" type="button">Play again <span aria-hidden="true">↻</span></button>
        </div>`;
      document.getElementById("restart").addEventListener("click", restart);
      document.getElementById("announcement").textContent = `Mission complete. ${result.title} You scored ${score} out of ${questions.length}.`;
    }

    function restart() {
      current = 0;
      score = 0;
      document.getElementById("quiz-content").innerHTML = `
        <div class="topline">
          <p class="eyebrow">Space explorer</p>
          <div class="score" aria-label="Current score">⭐ <span>Score</span> <strong id="score">0</strong></div>
        </div>
        <div class="progress-meta">
          <span id="question-count">Question 1 of 10</span>
          <span id="progress-percent">10%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <h1 id="question-title"></h1>
        <p class="subtitle">Choose the best answer to continue your mission.</p>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="card-footer">
          <span class="hint">One small step at a time 🚀</span>
          <button class="next-button" id="next" type="button" disabled>Check answer</button>
        </div>`;
      cacheElements();
      bindNext();
      renderQuestion();
    }

    function bindNext() {
      document.getElementById("next").addEventListener("click", () => {
        if (!answered) return;
        current++;
        if (current < questions.length) renderQuestion();
        else showResults();
      });
    }

    cacheElements();
    bindNext();
    renderQuestion();
  </script>
</body>
</html>
